<title>画像とは、数の表 — CG第2回 実演デモ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0E1219; --panel:#151B26; --panel2:#111722; --line:#26304A;
    --text:#E9EDF5; --sub:#93A0B4; --faint:#5A6578;
    --amber:#FFB45C; --cyan:#6CC6FF; --green:#46D99A; --red:#FF7B72;
    --hl-bg:rgba(255,180,92,.13); --add-bg:rgba(70,217,154,.12);
    --code-size:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
    font-size:15px; line-height:1.6;
    display:flex; flex-direction:column; min-height:100vh;
  }
  header{
    padding:14px 22px 12px;
    border-bottom:1px solid var(--line);
    display:flex; flex-wrap:wrap; align-items:center; gap:10px 22px;
    background:var(--panel2);
  }
  h1{font-size:20px; font-weight:700; letter-spacing:.02em; white-space:nowrap}
  h1 small{display:block; font-size:11.5px; font-weight:500; color:var(--sub); letter-spacing:.08em; margin-top:1px}
  .steps{display:flex; gap:8px; flex-wrap:wrap}
  .step-btn{
    font:inherit; font-size:14.5px; font-weight:600;
    color:var(--sub); background:transparent;
    border:1px solid var(--line); border-radius:8px;
    padding:8px 15px; cursor:pointer; white-space:nowrap;
    transition:color .15s, border-color .15s, background .15s;
  }
  .step-btn:hover{color:var(--text); border-color:#3B4970}
  .step-btn:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  .step-btn.active{color:#141005; background:var(--amber); border-color:var(--amber)}
  .keyhint{margin-left:auto; color:var(--sub); font-size:12px; white-space:nowrap}
  .keyhint kbd{
    font-family:ui-monospace,Menlo,monospace; font-size:11px;
    border:1px solid var(--line); border-bottom-width:2px; border-radius:4px;
    padding:1px 5px; margin:0 1px; color:var(--text); background:var(--panel);
  }
  #note{
    padding:9px 22px; font-size:14.5px; color:var(--amber);
    border-bottom:1px solid var(--line); background:rgba(255,180,92,.05);
    min-height:40px;
  }
  main{
    flex:1; display:grid; grid-template-columns:minmax(430px,560px) 1fr;
    gap:18px; padding:18px 22px 22px; align-items:start;
  }
  @media (max-width:980px){ main{grid-template-columns:1fr} }

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    overflow:hidden;
  }
  .panel-head{
    display:flex; align-items:center; gap:10px;
    padding:8px 14px; border-bottom:1px solid var(--line);
    font-size:12px; font-weight:600; letter-spacing:.12em; color:var(--sub);
  }
  .panel-head .dot{width:8px; height:8px; border-radius:50%; background:var(--amber)}

  /* 左カラム */
  #left{display:flex; flex-direction:column; gap:14px}
  #view{display:block; width:100%; aspect-ratio:1/1; cursor:crosshair; touch-action:none}
  #readout{
    padding:7px 14px; border-top:1px solid var(--line);
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:13.5px;
    color:var(--sub); min-height:34px; white-space:nowrap; overflow:hidden;
  }
  #readout b{color:var(--amber); font-weight:600}

  .controls{padding:12px 14px; display:flex; flex-direction:column; gap:10px}
  .ctl-row{display:flex; align-items:center; gap:12px}
  .ctl-row label{width:8.5em; font-size:13.5px; color:var(--sub); flex:none}
  .ctl-row output{
    width:3.4em; text-align:right; flex:none;
    font-family:ui-monospace,Menlo,monospace; font-size:13.5px; color:var(--amber);
  }
  input[type=range]{
    flex:1; appearance:none; -webkit-appearance:none; height:26px; background:transparent; cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{height:4px; border-radius:2px; background:#2A3550}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
    background:var(--amber); margin-top:-7px; border:none;
  }
  input[type=range]::-moz-range-track{height:4px; border-radius:2px; background:#2A3550}
  input[type=range]::-moz-range-thumb{width:18px; height:18px; border-radius:50%; background:var(--amber); border:none}
  input[type=range]:focus-visible{outline:2px solid var(--amber); outline-offset:2px}

  /* 右:コード */
  #code-panel .panel-head{justify-content:flex-start}
  .font-btns{margin-left:auto; display:flex; gap:6px}
  .font-btns button{
    font:inherit; font-size:12px; color:var(--sub); background:transparent;
    border:1px solid var(--line); border-radius:5px; padding:2px 9px; cursor:pointer;
  }
  .font-btns button:hover{color:var(--text)}
  #code{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:var(--code-size); line-height:1.75;
    padding:14px 0; overflow-x:auto;
  }
  .cl{display:flex; min-width:max-content; padding:0 18px 0 0}
  .cl .ln{
    flex:none; width:1.7em; text-align:right; padding-right:.6em;
    color:#4A5570; user-select:none; font-size:.75em; line-height:inherit; padding-top:.3em;
  }
  .cl code{white-space:pre; flex:1}
  .cl.hl{background:var(--hl-bg); box-shadow:inset 3px 0 0 var(--amber)}
  .cl.add{background:var(--add-bg); box-shadow:inset 3px 0 0 var(--green); animation:pulse .9s ease-out 2}
  @keyframes pulse{
    0%{background:rgba(70,217,154,.38)}
    100%{background:var(--add-bg)}
  }
  @media (prefers-reduced-motion:reduce){ .cl.add{animation:none} }
  .tok-kw{color:#C792EA}
  .tok-num{color:#F78C6C}
  .tok-fn{color:var(--cyan)}
  .tok-cm{color:#5F6E85}
  .tok-cm.imp{color:var(--green); font-weight:600}
  .hidden{display:none !important}

  /* スマホ向け調整 */
  @media (max-width:700px){
    :root{--code-size:14px}
    header{padding:10px 12px; gap:8px 12px}
    h1{font-size:16px; white-space:normal}
    h1 small{font-size:10.5px}
    .keyhint{display:none}
    .step-btn{padding:6px 10px; font-size:12.5px}
    #note{padding:7px 12px; font-size:12.5px; min-height:0}
    main{padding:10px; gap:12px}
    #readout{white-space:normal; font-size:12px; line-height:1.5}
    .ctl-row label{width:auto; min-width:6em; font-size:12.5px}
  }
</style>

<header>
  <h1>画像とは、数の表<small>コンピュータグラフィックス 第2回 実演 — そもそも画面に絵が出るとは</small></h1>
  <nav class="steps" id="steps" aria-label="実演ステップ"></nav>
  <div class="keyhint"><kbd>1</kbd>–<kbd>5</kbd> / <kbd>←</kbd><kbd>→</kbd> で切替</div>
</header>

<div id="note" role="status"></div>

<main>
  <div id="left">
    <section class="panel">
      <div class="panel-head"><span class="dot"></span>実行結果</div>
      <canvas id="view" width="520" height="520"></canvas>
      <div id="readout"></div>
    </section>

    <section class="panel hidden" id="ctl-panel">
      <div class="panel-head"><span class="dot"></span>見かたと情報量のコントロール</div>
      <div class="controls">
        <div class="ctl-row" id="zoom-row">
          <label for="szoom">倍率(ズーム)</label>
          <input type="range" id="szoom" min="1" max="16" step="1" value="1">
          <output id="ozoom">1×</output>
        </div>
        <div class="ctl-row hidden" id="res-row">
          <label for="sres">解像度</label>
          <input type="range" id="sres" min="0" max="6" step="1" value="0">
          <output id="ores">96</output>
        </div>
        <div class="ctl-row hidden" id="lv-row">
          <label for="slv">階調(各色)</label>
          <input type="range" id="slv" min="0" max="7" step="1" value="0">
          <output id="olv">256</output>
        </div>
      </div>
    </section>
  </div>

  <section class="panel" id="code-panel">
    <div class="panel-head">
      <span class="dot" style="background:var(--green)"></span>コード — 画像を作り、加工し、表示する
      <div class="font-btns">
        <button id="font-minus" aria-label="文字を小さく">A−</button>
        <button id="font-plus" aria-label="文字を大きく">A+</button>
      </div>
    </div>
    <div id="code"></div>
  </section>
</main>

<script>
'use strict';

/* ---------- 状態 ---------- */
const state = { stage: 1, zoom: 1, resIdx: 0, lvIdx: 0, hover: null, fontIdx: 1 };
const FONT_SIZES = [15, 18, 21, 24];
const RES_LIST = [96, 48, 32, 24, 16, 12, 8];        // 96 の約数だけ(ブロック平均が割り切れる)
const LV_LIST = [256, 128, 64, 32, 16, 8, 4, 2];

const STAGES = [
  { label:'① 絵に見える',     note:'第1回の計算(拡散反射)で作った球の画像。ふつうの絵に見える。……この「絵」の正体を、これから拡大して確かめます。' },
  { label:'② 拡大するとマス目', note:'倍率スライダーを上げていく(8倍以上で境界線が出る)。絵はマス目(ピクセル)の集まりだった。' },
  { label:'③ マス目の中身は数', note:'画像に触れると、そのマスの中身が見える。中身は (R, G, B) の3つの数。倍率を12倍以上にすると、マスの上に数そのものが現れる。' },
  { label:'④ 解像度を落とす',   note:'マスの数を減らす。データ量(縦×横×3バイト)は軽くなるが、絵はモザイクに。どこまで減らすと球に見えなくなる?' },
  { label:'⑤ 色を減らす',      note:'こんどは1マスに入る数の種類(階調)を減らす。2階調で白黒版画風。解像度と階調——画像の情報量はこの2つで決まる。' },
];

/* ---------- 96×96 のプロシージャル画像(第1回と同じ拡散反射の球) ---------- */
const SRC = 96;
const base = new Uint8ClampedArray(SRC * SRC * 3);
(function makeBase() {
  const R = 44, C = (SRC - 1) / 2;      // 球の半径(px)と中心
  const L = 1 / Math.sqrt(3);           // 光 (1, 1, 1) を長さ1に正規化
  for (let y = 0; y < SRC; y++) {
    for (let x = 0; x < SRC; x++) {
      const nx = (x - C) / R, ny = (C - y) / R;
      const r2 = nx * nx + ny * ny;
      const cov = Math.max(0, Math.min(1, (1 - Math.sqrt(r2)) * R + 0.5));  // 輪郭の被覆率
      let r = 255, g = 255, b = 255;    // 背景は白
      if (cov > 0) {
        const nz = Math.sqrt(1 - Math.min(r2, 0.999999));
        const d = Math.max(0, (nx + ny + nz) * L);   // 内積 = cosθ(第1回)
        r = 248 * d * cov + 255 * (1 - cov);
        g = 216 * d * cov + 255 * (1 - cov);
        b = 190 * d * cov + 255 * (1 - cov);
      }
      const k = (y * SRC + x) * 3;
      base[k] = r; base[k + 1] = g; base[k + 2] = b;
    }
  }
})();

/* ---------- 縮小(ブロック平均)と量子化 ---------- */
let cur = { r: SRC, data: base };

function rebuild() {
  const r = state.stage >= 4 ? RES_LIST[state.resIdx] : SRC;
  const lv = state.stage >= 5 ? LV_LIST[state.lvIdx] : 256;
  const out = new Uint8ClampedArray(r * r * 3);
  const bl = SRC / r;                   // 1マスにまとめる幅(ブロック)
  for (let ty = 0; ty < r; ty++) {
    for (let tx = 0; tx < r; tx++) {
      let sr = 0, sg = 0, sb = 0;
      for (let y = ty * bl; y < (ty + 1) * bl; y++) {
        for (let x = tx * bl; x < (tx + 1) * bl; x++) {
          const k = (y * SRC + x) * 3;
          sr += base[k]; sg += base[k + 1]; sb += base[k + 2];
        }
      }
      const n = bl * bl;
      let R = sr / n, G = sg / n, B = sb / n;
      if (lv < 256) {
        const step = 255 / (lv - 1);
        R = Math.round(R / step) * step;      // 量子化 = とびとびの値に丸める
        G = Math.round(G / step) * step;
        B = Math.round(B / step) * step;
      }
      const k2 = (ty * r + tx) * 3;
      out[k2] = R; out[k2 + 1] = G; out[k2 + 2] = B;
    }
  }
  cur = { r, data: out };
  if (state.hover && (state.hover.x >= r || state.hover.y >= r)) state.hover = null;
}
rebuild();

/* ---------- 描画 ---------- */
const view = document.getElementById('view');
const vctx = view.getContext('2d');
const RESV = 520;

// ①で使う「ほぼ等倍」表示用のオフスクリーン画像
const off = document.createElement('canvas');
off.width = SRC; off.height = SRC;
(function () {
  const octx = off.getContext('2d');
  const im = octx.createImageData(SRC, SRC);
  for (let i = 0, j = 0; i < SRC * SRC; i++, j += 4) {
    im.data[j] = base[i * 3]; im.data[j + 1] = base[i * 3 + 1];
    im.data[j + 2] = base[i * 3 + 2]; im.data[j + 3] = 255;
  }
  octx.putImageData(im, 0, 0);
})();

function cellSize() { return 520 / cur.r * state.zoom; }   // マス幅 = 520/解像度 × 倍率

function haloText(ctx, text, x, y, color) {
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(255,255,255,.9)';
  ctx.lineJoin = 'round';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function render() {
  vctx.fillStyle = '#FFFFFF';
  vctx.fillRect(0, 0, RESV, RESV);

  if (state.stage === 1) {
    // ほぼ等倍の「ただの絵」
    vctx.imageSmoothingEnabled = true;
    const S = 192, ox = (RESV - S) / 2, oy = 150;
    vctx.drawImage(off, ox, oy, S, S);
    vctx.strokeStyle = '#B9C2D0'; vctx.lineWidth = 1;
    vctx.strokeRect(ox - 0.5, oy - 0.5, S + 1, S + 1);
    vctx.fillStyle = '#5A6578';
    vctx.font = '13px ui-monospace, Menlo, monospace';
    vctx.textAlign = 'center';
    vctx.fillText('96 × 96 の画像(ほぼ等倍)', RESV / 2, oy + S + 24);
    return;
  }

  const r = cur.r, d = cur.data;
  const cell = cellSize();
  const o = 260 - r * cell / 2;                       // 画像の中心を canvas の中心に
  const x0 = Math.max(0, Math.floor((0 - o) / cell));
  const x1 = Math.min(r - 1, Math.ceil((RESV - o) / cell));
  const y0 = x0, y1 = x1;                             // 正方形なので同じ範囲

  vctx.imageSmoothingEnabled = false;
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const k = (y * r + x) * 3;
      vctx.fillStyle = `rgb(${d[k]},${d[k + 1]},${d[k + 2]})`;
      vctx.fillRect(o + x * cell, o + y * cell, cell + 0.6, cell + 0.6);
    }
  }

  // マス目の境界線(マス幅 40px 以上 = 96×96 なら8倍以上)
  if (cell >= 40) {
    vctx.strokeStyle = '#9AA3B5';
    vctx.lineWidth = 1;
    const top = Math.max(0, o), bot = Math.min(RESV, o + r * cell);
    vctx.beginPath();
    for (let x = x0; x <= x1 + 1; x++) {
      vctx.moveTo(o + x * cell, top); vctx.lineTo(o + x * cell, bot);
      vctx.moveTo(top, o + x * cell); vctx.lineTo(bot, o + x * cell);
    }
    vctx.stroke();
  }

  // マスの上に数値を描く(③〜、マス幅 65px 以上 = 12倍以上)
  if (state.stage >= 3 && cell >= 65) {
    const fs = Math.round(Math.min(17, cell * 0.22));
    vctx.font = fs + 'px ui-monospace, Menlo, monospace';
    vctx.textAlign = 'center';
    const cols = ['#C13E2E', '#1A7A4F', '#2B6CB0'];
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const k = (y * r + x) * 3;
        const cx = o + (x + 0.5) * cell;
        haloText(vctx, 'R ' + d[k],     cx, o + y * cell + cell * 0.32, cols[0]);
        haloText(vctx, 'G ' + d[k + 1], cx, o + y * cell + cell * 0.57, cols[1]);
        haloText(vctx, 'B ' + d[k + 2], cx, o + y * cell + cell * 0.82, cols[2]);
      }
    }
  }

  // 触れているマスの強調
  if (state.hover && state.stage >= 3) {
    vctx.strokeStyle = '#E0821F';
    vctx.lineWidth = 3;
    vctx.strokeRect(o + state.hover.x * cell, o + state.hover.y * cell, cell, cell);
  }
}

/* ---------- コード表示 ---------- */
const codeEl = document.getElementById('code');

function zoomLineText() {
  return `const 倍率 = ${state.zoom};                 // ← ズームスライダー(1〜16)`;
}
function cellLineText() {
  const sym = state.stage >= 4 ? '解像度' : '96';
  return `const マス幅 = 520 / ${sym} * 倍率;      // = ${cellSize().toFixed(1)} px`;
}
function pxLineText() {
  if (state.hover) {
    const { x, y } = state.hover;
    const k = (y * cur.r + x) * 3, d = cur.data;
    return `const [R, G, B] = 画像[${y}][${x}];    // = (${d[k]}, ${d[k + 1]}, ${d[k + 2]})`;
  }
  return 'const [R, G, B] = 画像[y][x];        // ← 画像のマスに触れてみる';
}
function resLineText() {
  return `const 解像度 = ${RES_LIST[state.resIdx]};             // ← 解像度スライダー(96→8)`;
}
function dataLineText() {
  const r = state.stage >= 4 ? RES_LIST[state.resIdx] : SRC;
  if (state.stage >= 5) {
    const lv = LV_LIST[state.lvIdx], b = Math.log2(lv);
    return `// データ量 = ${r}×${r} × 3色 × ${b}ビット ÷ 8 = ${(r * r * 3 * b / 8).toLocaleString('en-US')} バイト`;
  }
  return `// データ量 = ${r} × ${r} × 3バイト = ${(r * r * 3).toLocaleString('en-US')} バイト`;
}
function lvLineText() {
  return `const 階調 = ${LV_LIST[state.lvIdx]};               // ← 階調スライダー(256→2)`;
}
function stepLineText() {
  const lv = LV_LIST[state.lvIdx];
  return `const step = 255 / (階調 - 1);        // = ${(255 / (lv - 1)).toFixed(1)}`;
}

function codeLines() {
  const s = state.stage;
  const L = [];
  const add = (t, k) => L.push({ t, k: k || '' });

  add('// 第1回のやり方で 96×96 の画像を作る(拡散反射の球)');
  add('for (let y = 0; y < 96; y++)');
  add('  for (let x = 0; x < 96; x++) {');
  add('    const d = 明るさ(x, y);               // 内積 = cosθ(第1回)');
  add('    画像[y][x] = [248*d, 216*d, 190*d];  // 1マス = 3つの数 (R,G,B)', s === 1 ? 'hl' : '');
  add('  }');
  if (s === 1) {
    add('');
    add('画面に表示(画像);                        // ふつうの絵に見える');
    return L;
  }
  if (s >= 4) {
    add('');
    add('// ★ 縮小:マスをまとめて平均 → 解像度を落とす', s === 4 ? 'add' : '');
    add(resLineText(), (s === 4 ? 'add ' : '') + 'dynres');
    add('画像 = ブロック平均(画像, 解像度);        // 96×96 → 解像度×解像度', s === 4 ? 'add hl' : '');
    add(dataLineText(), (s === 4 ? 'add ' : '') + 'dyndata');
  }
  if (s >= 5) {
    add('');
    add('// ★ 量子化:とびとびの値に丸める → 階調を減らす', s === 5 ? 'add' : '');
    add(lvLineText(), (s === 5 ? 'add ' : '') + 'dynlv');
    add(stepLineText(), (s === 5 ? 'add ' : '') + 'dynstep');
    add('各マスの R = Math.round(R / step) * step;   // G, B も同じ', s === 5 ? 'add hl' : '');
  }
  add('');
  add('// ★ 拡大して見る:1マス = ひとつの色ぬり四角', s === 2 ? 'add' : '');
  add(zoomLineText(), (s === 2 ? 'add ' : '') + 'dynz');
  add(cellLineText(), (s === 2 ? 'add ' : '') + 'dyncell');
  add('各マスを マス幅 の四角で塗る;', s === 2 ? 'add' : '');
  add('if (マス幅 >= 40) 境界線を描く;           // マス目が見えてくる', s === 2 ? 'add hl' : '');
  if (s >= 3) {
    add('if (マス幅 >= 65) 中身の数も書き込む;', s === 3 ? 'add' : '');
    add('');
    add('// マスの中身をのぞく(画像に触れたマス)', s === 3 ? 'add' : '');
    add(pxLineText(), (s === 3 ? 'add hl ' : '') + 'dynpx');
  }
  return L;
}

function esc(t) {
  return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function highlightJS(line) {
  const ci = line.indexOf('//');
  let code = ci >= 0 ? line.slice(0, ci) : line;
  let com = ci >= 0 ? line.slice(ci) : '';
  code = esc(code).replace(
    /\b(function|let|const|return|for|if|else)\b|\b(Math\.\w+)\b|(\d+\.?\d*)/g,
    (m, kw, fn, num) => kw ? `<span class="tok-kw">${kw}</span>`
      : fn ? `<span class="tok-fn">${fn}</span>`
      : `<span class="tok-num">${num}</span>`
  );
  if (com) {
    const imp = com.includes('★') ? ' imp' : '';
    com = `<span class="tok-cm${imp}">${esc(com)}</span>`;
  }
  return code + com;
}

const DYNS = ['dynz', 'dyncell', 'dynpx', 'dynres', 'dyndata', 'dynlv', 'dynstep'];
const DYN_TEXT = {
  dynz: zoomLineText, dyncell: cellLineText, dynpx: pxLineText,
  dynres: resLineText, dyndata: dataLineText, dynlv: lvLineText, dynstep: stepLineText,
};
let dynEls = {};

function buildCode() {
  const lines = codeLines();
  codeEl.innerHTML = lines.map((l, i) =>
    `<div class="cl ${l.k}"><span class="ln">${i + 1}</span><code>${highlightJS(l.t) || ' '}</code></div>`
  ).join('');
  dynEls = {};
  for (const c of DYNS) {
    const el = codeEl.querySelector('.cl.' + c + ' code');
    if (el) dynEls[c] = el;
  }
}

// スライダー操作中は該当行だけ書き換える(全再構築だと追加行の点滅が再発火するため)
function updateDyn() {
  for (const c in dynEls) dynEls[c].innerHTML = highlightJS(DYN_TEXT[c]());
}

/* ---------- 読み出し ---------- */
const readout = document.getElementById('readout');

function updateReadout() {
  const r = cur.r;
  if (state.stage === 1) {
    readout.innerHTML = '96 × 96 の画像。ふつうの<b>絵</b>に見える。——本当に、ただの絵?';
  } else if (state.stage === 2) {
    const cell = cellSize();
    readout.innerHTML = `倍率 <b>${state.zoom}×</b>(マス幅 ${cell.toFixed(1)}px)` +
      (cell >= 40 ? ' — マス目が見えた。絵は<b>ピクセル</b>の集まり。' : ' — 8倍以上に上げると……?');
  } else if (state.stage === 3) {
    if (state.hover) {
      const { x, y } = state.hover;
      const k = (y * r + x) * 3, d = cur.data;
      readout.innerHTML = `画素 (x=${x}, y=${y}) の中身 = (R <b>${d[k]}</b>, G <b>${d[k + 1]}</b>, B <b>${d[k + 2]}</b>)`;
    } else {
      readout.innerHTML = '画像に触れると、そのマスの中身(3つの数)が見える。倍率 12× 以上でマスの上にも数が出る。';
    }
  } else if (state.stage === 4) {
    readout.innerHTML = `解像度 <b>${r} × ${r}</b> → データ量 = ${r}×${r}×3 = <b>${(r * r * 3).toLocaleString('en-US')} バイト</b>(96×96 なら 27,648 バイト)`;
  } else {
    const lv = LV_LIST[state.lvIdx], b = Math.log2(lv);
    readout.innerHTML = `階調 <b>${lv}</b>(${b}ビット/色)× 解像度 ${r}×${r} → データ量 = <b>${(r * r * 3 * b / 8).toLocaleString('en-US')} バイト</b>`;
  }
}

/* ---------- ステージ切替 ---------- */
const stepsEl = document.getElementById('steps');
const noteEl = document.getElementById('note');

STAGES.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'step-btn';
  b.textContent = s.label;
  b.addEventListener('click', () => setStage(i + 1));
  stepsEl.appendChild(b);
});

function setStage(n) {
  state.stage = Math.max(1, Math.min(5, n));
  [...stepsEl.children].forEach((b, i) => b.classList.toggle('active', i + 1 === state.stage));
  noteEl.textContent = STAGES[state.stage - 1].note;
  document.getElementById('ctl-panel').classList.toggle('hidden', state.stage === 1);
  document.getElementById('res-row').classList.toggle('hidden', state.stage < 4);
  document.getElementById('lv-row').classList.toggle('hidden', state.stage < 5);
  if (state.stage < 3) state.hover = null;
  rebuild();
  buildCode();
  updateReadout();
  requestRender();
}

/* ---------- 再描画(フレーム間引き) ---------- */
let pending = false;
function requestRender() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => { pending = false; render(); });
}

/* ---------- スライダー ---------- */
const szoom = document.getElementById('szoom'), ozoom = document.getElementById('ozoom');
const sres = document.getElementById('sres'), ores = document.getElementById('ores');
const slv = document.getElementById('slv'), olv = document.getElementById('olv');

szoom.addEventListener('input', () => {
  state.zoom = parseInt(szoom.value, 10);
  ozoom.value = state.zoom + '×';
  updateDyn(); updateReadout(); requestRender();
});
sres.addEventListener('input', () => {
  state.resIdx = parseInt(sres.value, 10);
  ores.value = RES_LIST[state.resIdx];
  rebuild();
  updateDyn(); updateReadout(); requestRender();
});
slv.addEventListener('input', () => {
  state.lvIdx = parseInt(slv.value, 10);
  olv.value = LV_LIST[state.lvIdx];
  rebuild();
  updateDyn(); updateReadout(); requestRender();
});

/* ---------- マウス / タッチ:マスをのぞく ---------- */
function pixAt(ev) {
  const rct = view.getBoundingClientRect();
  const px = (ev.clientX - rct.left) / rct.width * RESV;
  const py = (ev.clientY - rct.top) / rct.height * RESV;
  const r = cur.r, cell = cellSize(), o = 260 - r * cell / 2;
  const x = Math.floor((px - o) / cell), y = Math.floor((py - o) / cell);
  return (x >= 0 && y >= 0 && x < r && y < r) ? { x, y } : null;
}
function onPointer(ev) {
  if (state.stage < 3) return;
  const h = pixAt(ev);
  const changed = !state.hover || !h || h.x !== state.hover.x || h.y !== state.hover.y;
  state.hover = h;
  if (changed) { updateDyn(); updateReadout(); requestRender(); }
}
view.addEventListener('pointermove', onPointer);
view.addEventListener('pointerdown', ev => { ev.preventDefault(); onPointer(ev); });
view.addEventListener('pointerleave', () => {
  if (!state.hover) return;
  state.hover = null;
  updateDyn(); updateReadout(); requestRender();
});

/* ---------- コード文字サイズ ---------- */
function setFont(i) {
  state.fontIdx = Math.max(0, Math.min(FONT_SIZES.length - 1, i));
  document.documentElement.style.setProperty('--code-size', FONT_SIZES[state.fontIdx] + 'px');
}
document.getElementById('font-plus').addEventListener('click', () => setFont(state.fontIdx + 1));
document.getElementById('font-minus').addEventListener('click', () => setFont(state.fontIdx - 1));

/* ---------- キーボード ---------- */
window.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT') return;
  if (ev.key >= '1' && ev.key <= '5') setStage(+ev.key);
  else if (ev.key === 'ArrowRight') setStage(state.stage + 1);
  else if (ev.key === 'ArrowLeft') setStage(state.stage - 1);
});

/* ---------- 起動 ---------- */
setStage(1);
</script>
