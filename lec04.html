<title>動かす数学 — 行列 — CG第4回 実演デモ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0E1219; --panel:#151B26; --panel2:#111722; --line:#26304A;
    --text:#E9EDF5; --sub:#93A0B4; --faint:#5A6578;
    --amber:#FFB45C; --cyan:#6CC6FF; --green:#46D99A; --red:#FF7B72;
    --hl-bg:rgba(255,180,92,.13); --add-bg:rgba(70,217,154,.12);
    --code-size:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
    font-size:15px; line-height:1.6;
    display:flex; flex-direction:column; min-height:100vh;
  }
  header{
    padding:14px 22px 12px;
    border-bottom:1px solid var(--line);
    display:flex; flex-wrap:wrap; align-items:center; gap:10px 22px;
    background:var(--panel2);
  }
  h1{font-size:20px; font-weight:700; letter-spacing:.02em; white-space:nowrap}
  h1 small{display:block; font-size:11.5px; font-weight:500; color:var(--sub); letter-spacing:.08em; margin-top:1px}
  .steps{display:flex; gap:8px; flex-wrap:wrap}
  .step-btn{
    font:inherit; font-size:14.5px; font-weight:600;
    color:var(--sub); background:transparent;
    border:1px solid var(--line); border-radius:8px;
    padding:8px 15px; cursor:pointer; white-space:nowrap;
    transition:color .15s, border-color .15s, background .15s;
  }
  .step-btn:hover{color:var(--text); border-color:#3B4970}
  .step-btn:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  .step-btn.active{color:#141005; background:var(--amber); border-color:var(--amber)}
  .keyhint{margin-left:auto; color:var(--sub); font-size:12px; white-space:nowrap}
  .keyhint kbd{
    font-family:ui-monospace,Menlo,monospace; font-size:11px;
    border:1px solid var(--line); border-bottom-width:2px; border-radius:4px;
    padding:1px 5px; margin:0 1px; color:var(--text); background:var(--panel);
  }
  #note{
    padding:9px 22px; font-size:14.5px; color:var(--amber);
    border-bottom:1px solid var(--line); background:rgba(255,180,92,.05);
    min-height:40px;
  }
  main{
    flex:1; display:grid; grid-template-columns:minmax(430px,560px) 1fr;
    gap:18px; padding:18px 22px 22px; align-items:start;
  }
  @media (max-width:980px){ main{grid-template-columns:1fr} }

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    overflow:hidden;
  }
  .panel-head{
    display:flex; align-items:center; gap:10px;
    padding:8px 14px; border-bottom:1px solid var(--line);
    font-size:12px; font-weight:600; letter-spacing:.12em; color:var(--sub);
  }
  .panel-head .dot{width:8px; height:8px; border-radius:50%; background:var(--amber)}

  #left{display:flex; flex-direction:column; gap:14px}
  #view{display:block; width:100%; aspect-ratio:1/1}
  #readout{
    padding:7px 14px; border-top:1px solid var(--line);
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:13.5px;
    color:var(--sub); min-height:34px; white-space:nowrap; overflow:hidden;
  }
  #readout b{color:var(--amber); font-weight:600}

  .controls{padding:12px 14px; display:flex; flex-direction:column; gap:10px}
  .ctl-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .ctl-row label{width:8.5em; font-size:13.5px; color:var(--sub); flex:none}
  .ctl-row output{
    width:3.4em; text-align:right; flex:none;
    font-family:ui-monospace,Menlo,monospace; font-size:13.5px; color:var(--amber);
  }
  input[type=range]{
    flex:1; appearance:none; -webkit-appearance:none; height:26px; background:transparent; cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{height:4px; border-radius:2px; background:#2A3550}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
    background:var(--amber); margin-top:-7px; border:none;
  }
  input[type=range]::-moz-range-track{height:4px; border-radius:2px; background:#2A3550}
  input[type=range]::-moz-range-thumb{width:18px; height:18px; border-radius:50%; background:var(--amber); border:none}
  input[type=range]:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  .btn{
    font:inherit; font-size:13px; color:var(--text);
    background:#212A3E; border:1px solid var(--line); border-radius:7px;
    padding:6px 13px; cursor:pointer; white-space:nowrap;
  }
  .btn:hover{background:#2A3550}
  .btn:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  .btn[aria-pressed="true"]{color:#141005; background:var(--red); border-color:var(--red)}
  .ctl-hint{font-size:13px; color:var(--sub)}
  .ctl-hint b{color:var(--text); font-weight:600}

  #code-panel .panel-head{justify-content:flex-start}
  .font-btns{margin-left:auto; display:flex; gap:6px}
  .font-btns button{
    font:inherit; font-size:12px; color:var(--sub); background:transparent;
    border:1px solid var(--line); border-radius:5px; padding:2px 9px; cursor:pointer;
  }
  .font-btns button:hover{color:var(--text)}
  #code{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:var(--code-size); line-height:1.75;
    padding:14px 0; overflow-x:auto;
  }
  .cl{display:flex; min-width:max-content; padding:0 18px 0 0}
  .cl .ln{
    flex:none; width:1.7em; text-align:right; padding-right:.6em;
    color:#4A5570; user-select:none; font-size:.75em; line-height:inherit; padding-top:.3em;
  }
  .cl code{white-space:pre; flex:1}
  .cl.hl{background:var(--hl-bg); box-shadow:inset 3px 0 0 var(--amber)}
  .cl.add{background:var(--add-bg); box-shadow:inset 3px 0 0 var(--green); animation:pulse .9s ease-out 2}
  @keyframes pulse{
    0%{background:rgba(70,217,154,.38)}
    100%{background:var(--add-bg)}
  }
  @media (prefers-reduced-motion:reduce){ .cl.add{animation:none} }
  .tok-kw{color:#C792EA}
  .tok-num{color:#F78C6C}
  .tok-fn{color:var(--cyan)}
  .tok-cm{color:#5F6E85}
  .tok-cm.imp{color:var(--green); font-weight:600}
  .hidden{display:none !important}

  /* スマホ向け調整 */
  @media (max-width:700px){
    :root{--code-size:14px}
    header{padding:10px 12px; gap:8px 12px}
    h1{font-size:16px; white-space:normal}
    h1 small{font-size:10.5px}
    .keyhint{display:none}
    .step-btn{padding:6px 10px; font-size:12.5px}
    #note{padding:7px 12px; font-size:12.5px; min-height:0}
    main{padding:10px; gap:12px}
    #readout{white-space:normal; font-size:12px; line-height:1.5}
    .ctl-row label{width:auto; min-width:6em; font-size:12.5px}
    .ctl-hint{font-size:12px}
  }
</style>

<header>
  <h1>動かす数学 — 行列<small>コンピュータグラフィックス 第4回 実演 — 拡大・回転を数で書く</small></h1>
  <nav class="steps" id="steps" aria-label="実演ステップ"></nav>
  <div class="keyhint"><kbd>1</kbd>–<kbd>5</kbd> / <kbd>←</kbd><kbd>→</kbd> で切替</div>
</header>

<div id="note" role="status"></div>

<main>
  <div id="left">
    <section class="panel">
      <div class="panel-head"><span class="dot"></span>実行結果 — 方眼紙の上の F(点線 = 元の形)</div>
      <canvas id="view" width="520" height="520"></canvas>
      <div id="readout"></div>
    </section>

    <section class="panel" id="scale-panel">
      <div class="panel-head"><span class="dot"></span>拡大縮小のつまみ</div>
      <div class="controls">
        <div class="ctl-row">
          <label for="ssx">横の倍率 sx</label>
          <input type="range" id="ssx" min="0.2" max="2" step="0.05" value="1.5">
          <output id="osx">1.50</output>
        </div>
        <div class="ctl-row">
          <label for="ssy">縦の倍率 sy</label>
          <input type="range" id="ssy" min="0.2" max="2" step="0.05" value="1">
          <output id="osy">1.00</output>
        </div>
        <div class="ctl-row">
          <button class="btn" id="scale-reset">等倍 (1, 1) に戻す</button>
        </div>
      </div>
    </section>

    <section class="panel hidden" id="rot-panel">
      <div class="panel-head"><span class="dot"></span>回転のつまみ</div>
      <div class="controls">
        <div class="ctl-row">
          <label for="sth">角度 θ</label>
          <input type="range" id="sth" min="-180" max="180" step="1" value="30">
          <output id="oth">30°</output>
        </div>
        <div class="ctl-row">
          <button class="btn" id="rot-reset">0° に戻す</button>
        </div>
      </div>
    </section>

    <section class="panel hidden" id="bug-panel">
      <div class="panel-head"><span class="dot" style="background:var(--red)"></span>わざと壊す</div>
      <div class="controls">
        <div class="ctl-row">
          <button class="btn" id="bug-btn" aria-pressed="false">sin の符号を1か所間違える(B)</button>
          <span class="ctl-hint" id="bug-hint">いまは正しい回転の行列</span>
        </div>
      </div>
    </section>
  </div>

  <section class="panel" id="code-panel">
    <div class="panel-head">
      <span class="dot" style="background:var(--green)"></span>コード — 頂点ごとに実行される計算
      <div class="font-btns">
        <button id="font-minus" aria-label="文字を小さく">A−</button>
        <button id="font-plus" aria-label="文字を大きく">A+</button>
      </div>
    </div>
    <div id="code"></div>
  </section>
</main>

<script>
'use strict';

/* ---------- 状態 ---------- */
const state = { stage: 1, sx: 1.5, sy: 1.0, th: 30, bug: false, fontIdx: 1 };
const FONT_SIZES = [15, 18, 21, 24];

const STAGES = [
  { label:'① 拡大縮小',
    note:'頂点の座標 (x, y) に行列 [[sx, 0], [0, sy]] を掛けるだけで、F ぜんたいが伸び縮みする。方眼紙のマス目ごと変わっているのに注目。' },
  { label:'② 回転',
    note:'θ を動かすと F が回る。中身は cos と sin の4つだけ——第1回「明るさ = cos θ」で出てきた、あの cos θ の再登場。' },
  { label:'③ 矢印の行き先',
    note:'行列の正体:1列目は矢印 (1,0) の行き先(赤)、2列目は (0,1) の行き先(青)。2本の矢印の行き先さえ決めれば、方眼紙ごと全部が決まる。' },
  { label:'④ 診断:符号ミス',
    note:'ボタンで sin の符号を1か所だけ書き間違えてみる。行列が対称になり、回転のはずが鏡映+つぶれに。たった1文字で形が壊れる。θ = 45° で試すと F は線につぶれる。' },
  { label:'⑤ 回転+拡大',
    note:'回転と拡大を同時にかける。2つの行列の積が1つの行列にまとまる——コードの中で数値が掛け算になっているのを確認。' },
];

/* ---------- 行列(表示コードと同じ計算) ---------- */
function matrix() {
  const rad = state.th * Math.PI / 180;
  const c = Math.cos(rad), s = Math.sin(rad);
  if (state.stage === 1) return [state.sx, 0, 0, state.sy];
  if (state.stage === 4 && state.bug) return [c, s, s, c];      // - s を + s に間違えた行列
  if (state.stage === 5) return [c * state.sx, -s * state.sy, s * state.sx, c * state.sy];
  return [c, -s, s, c];
}
function apply(M, x, y) { return [M[0] * x + M[1] * y, M[2] * x + M[3] * y]; }

/* ---------- 描画 ---------- */
const view = document.getElementById('view');
const vctx = view.getContext('2d');
const RES = 520, U = 36, CX = 260, CY = 290;

// 向きの分かる「F」の形(原点が左下)
const FPTS = [[0,0],[0.7,0],[0.7,1.2],[1.7,1.2],[1.7,1.9],[0.7,1.9],[0.7,2.3],[2,2.3],[2,3],[0,3]];

const toPx = (x, y) => [CX + x * U, CY - y * U];

function drawArrow(ctx, x0, y0, x1, y1, head) {
  const a = Math.atan2(y1 - y0, x1 - x0);
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - head * Math.cos(a - 0.45), y1 - head * Math.sin(a - 0.45));
  ctx.lineTo(x1 - head * Math.cos(a + 0.45), y1 - head * Math.sin(a + 0.45));
  ctx.closePath(); ctx.fill();
}
function haloArrow(ctx, x0, y0, x1, y1, head, color, width) {
  ctx.strokeStyle = ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.lineWidth = width + 3.5;
  drawArrow(ctx, x0, y0, x1, y1, head + 3);
  ctx.strokeStyle = ctx.fillStyle = color;
  ctx.lineWidth = width;
  drawArrow(ctx, x0, y0, x1, y1, head);
}
function haloText(ctx, text, x, y, color) {
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(255,255,255,.9)';
  ctx.lineJoin = 'round';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function drawBaseGrid() {
  vctx.strokeStyle = '#E3E8F0'; vctx.lineWidth = 1;
  for (let g = -8; g <= 8; g++) {
    vctx.beginPath(); vctx.moveTo(CX + g * U, 0); vctx.lineTo(CX + g * U, RES); vctx.stroke();
    vctx.beginPath(); vctx.moveTo(0, CY - g * U); vctx.lineTo(RES, CY - g * U); vctx.stroke();
  }
}
function drawTransformedGrid(M) {
  vctx.strokeStyle = 'rgba(224,130,31,.20)'; vctx.lineWidth = 1;
  for (let g = -8; g <= 8; g++) {
    let p = apply(M, g, -8), q = apply(M, g, 8);
    vctx.beginPath(); vctx.moveTo(...toPx(p[0], p[1])); vctx.lineTo(...toPx(q[0], q[1])); vctx.stroke();
    p = apply(M, -8, g); q = apply(M, 8, g);
    vctx.beginPath(); vctx.moveTo(...toPx(p[0], p[1])); vctx.lineTo(...toPx(q[0], q[1])); vctx.stroke();
  }
}
function drawAxes() {
  vctx.strokeStyle = '#9AA5B8'; vctx.lineWidth = 1.6;
  vctx.beginPath(); vctx.moveTo(0, CY); vctx.lineTo(RES, CY); vctx.stroke();
  vctx.beginPath(); vctx.moveTo(CX, 0); vctx.lineTo(CX, RES); vctx.stroke();
  vctx.fillStyle = '#3A4560';
  vctx.beginPath(); vctx.arc(CX, CY, 3.5, 0, Math.PI * 2); vctx.fill();
  vctx.font = '12px ui-monospace, Menlo, monospace'; vctx.textAlign = 'left';
  vctx.fillStyle = '#9AA5B8';
  vctx.fillText('x', RES - 16, CY - 8);
  vctx.fillText('y', CX + 8, 14);
}
function drawFShape(M, ghost) {
  vctx.beginPath();
  FPTS.forEach((p, i) => {
    const [x, y] = apply(M, p[0], p[1]);
    const [px, py] = toPx(x, y);
    i === 0 ? vctx.moveTo(px, py) : vctx.lineTo(px, py);
  });
  vctx.closePath();
  if (ghost) {
    vctx.setLineDash([6, 5]);
    vctx.strokeStyle = '#9AA5B8'; vctx.lineWidth = 2;
    vctx.stroke();
    vctx.setLineDash([]);
  } else {
    vctx.fillStyle = 'rgba(242,200,158,.85)';
    vctx.strokeStyle = '#3A4560'; vctx.lineWidth = 2.5;
    vctx.fill(); vctx.stroke();
  }
}
function drawBasis(M) {
  const [a, b, c, d] = M;
  // 元の基準の矢印(うすい点線)
  vctx.setLineDash([4, 4]);
  vctx.strokeStyle = vctx.fillStyle = '#B9C2D0'; vctx.lineWidth = 2;
  drawArrow(vctx, CX, CY, ...toPx(1, 0), 7);
  drawArrow(vctx, CX, CY, ...toPx(0, 1), 7);
  vctx.setLineDash([]);
  // 行き先(= 行列の2つの列)
  const rT = toPx(a, c), bT = toPx(b, d);
  haloArrow(vctx, CX, CY, rT[0], rT[1], 10, '#D64545', 3.2);
  haloArrow(vctx, CX, CY, bT[0], bT[1], 10, '#2B7FD4', 3.2);
  vctx.font = '13px ui-monospace, Menlo, monospace';
  vctx.textAlign = rT[0] < CX ? 'right' : 'left';
  haloText(vctx, `(1,0)→(${a.toFixed(2)}, ${c.toFixed(2)})`, rT[0] + (rT[0] < CX ? -10 : 10), rT[1] + 14, '#D64545');
  vctx.textAlign = bT[0] < CX ? 'right' : 'left';
  haloText(vctx, `(0,1)→(${b.toFixed(2)}, ${d.toFixed(2)})`, bT[0] + (bT[0] < CX ? -10 : 10), bT[1] - 10, '#2B7FD4');
}

function render() {
  vctx.fillStyle = '#FFFFFF';
  vctx.fillRect(0, 0, RES, RES);
  drawBaseGrid();
  const M = matrix();
  drawTransformedGrid(M);
  drawAxes();
  drawFShape([1, 0, 0, 1], true);   // 元の F(ゴースト)
  drawFShape(M, false);             // 変換後の F
  if (state.stage >= 3) drawBasis(M);
}

/* ---------- コード表示 ---------- */
const codeEl = document.getElementById('code');
const f2 = v => (v >= 0 ? ' ' : '') + v.toFixed(2);

function paramLineText() {
  if (state.stage === 1) return `const sx = ${f2(state.sx)}, sy = ${f2(state.sy)};        // ← スライダー`;
  return `const θ = ${state.th} * Math.PI / 180;      // ← スライダー(いま ${state.th}°)`;
}
function param2LineText() {
  return `const sx = ${f2(state.sx)}, sy = ${f2(state.sy)};       // ← 倍率スライダー`;
}
function matLineText() {
  const [a, b, c, d] = matrix();
  return `// いまの行列 [[${f2(a)}, ${f2(b)}], [${f2(c)}, ${f2(d)}]]`;
}
function b1LineText() {
  const M = matrix();
  return `// 赤 (1,0) → 1列目 (${f2(M[0])}, ${f2(M[2])})`;
}
function b2LineText() {
  const M = matrix();
  return `// 青 (0,1) → 2列目 (${f2(M[1])}, ${f2(M[3])})`;
}

function codeLines() {
  const s = state.stage;
  const L = [];
  const add = (t, k) => L.push({ t, k: k || '' });

  add('// F の頂点 (x, y) の1つ1つに、同じ計算をする');
  if (s === 1) {
    add(paramLineText(), 'dynp');
    add('');
    add('// 拡大縮小の行列 [[sx, 0], [0, sy]] を掛ける');
    add('x2 = sx * x + 0 * y;    // 横だけ sx 倍', 'hl');
    add('y2 = 0 * x + sy * y;    // 縦だけ sy 倍', 'hl');
    add('');
    add(matLineText(), 'dynm');
    return L;
  }
  add(paramLineText(), 'dynp');
  if (s === 5) add(param2LineText(), 'dynp2');
  add('const c = Math.cos(θ), s = Math.sin(θ);' + (s === 2 ? '   // ★ 第1回の cos θ の再登場' : ''), s === 2 ? 'add' : '');
  add('');
  if (s === 2 || s === 3) {
    add('// 回転の行列 [[c, -s], [s, c]] を掛ける');
    add('x2 = c * x - s * y;', s === 2 ? 'add' : '');
    add('y2 = s * x + c * y;', s === 2 ? 'add' : '');
  } else if (s === 4) {
    if (state.bug) {
      add('// 回転の行列……のつもりが、1文字ミス');
      add('x2 = c * x + s * y;     // ★ 本当は - s。これだけで形が壊れる', 'hl');
      add('y2 = s * x + c * y;');
    } else {
      add('// 回転の行列 [[c, -s], [s, c]](いまは正しい)');
      add('x2 = c * x - s * y;     // ← この - s を、ボタンで + s にしてみる', 'hl');
      add('y2 = s * x + c * y;');
    }
  } else if (s === 5) {
    add('// ★ 回転 R × 拡大 S:先に掛けて、1つの行列にまとめる', 'add');
    add('a  = c * sx;   b = -s * sy;', 'add');
    add('c2 = s * sx;   d =  c * sy;', 'add');
    add('x2 = a  * x + b * y;');
    add('y2 = c2 * x + d * y;');
  }
  add('');
  if (s === 3) {
    add('// ★ 行列の2つの列は「基準の矢印の行き先」', 'add');
    add(b1LineText(), 'add dynb1');
    add(b2LineText(), 'add dynb2');
  }
  add(matLineText(), (s === 3 || s === 4) ? 'dynm hl' : 'dynm');
  return L;
}

function esc(t) {
  return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function highlightJS(line) {
  const ci = line.indexOf('//');
  let code = ci >= 0 ? line.slice(0, ci) : line;
  let com = ci >= 0 ? line.slice(ci) : '';
  code = esc(code).replace(
    /\b(function|let|const|return|for|if|else)\b|\b(Math\.\w+)\b|(\d+\.?\d*)/g,
    (m, kw, fn, num) => kw ? `<span class="tok-kw">${kw}</span>`
      : fn ? `<span class="tok-fn">${fn}</span>`
      : `<span class="tok-num">${num}</span>`
  );
  if (com) {
    const imp = com.includes('★') ? ' imp' : '';
    com = `<span class="tok-cm${imp}">${esc(com)}</span>`;
  }
  return code + com;
}

function buildCode() {
  const lines = codeLines();
  codeEl.innerHTML = lines.map((l, i) =>
    `<div class="cl ${l.k}"><span class="ln">${i + 1}</span><code>${highlightJS(l.t) || ' '}</code></div>`
  ).join('');
}

// スライダー操作中は dyn の行だけ書き換える(全再構築だと追加行の点滅が再発火するため)
const DYN_LINES = { dynp: paramLineText, dynp2: param2LineText, dynm: matLineText, dynb1: b1LineText, dynb2: b2LineText };
function updateDynLines() {
  for (const k in DYN_LINES) {
    const el = codeEl.querySelector('.cl.' + k + ' code');
    if (el) el.innerHTML = highlightJS(DYN_LINES[k]());
  }
}

/* ---------- 読み出し ---------- */
const readout = document.getElementById('readout');

function updateReadout() {
  const [a, b, c, d] = matrix();
  const m = `[[<b>${f2(a)}</b>, <b>${f2(b)}</b>], [<b>${f2(c)}</b>, <b>${f2(d)}</b>]]`;
  const s = state.stage;
  if (s === 1) {
    readout.innerHTML = `行列 ${m} — 横 <b>${state.sx.toFixed(2)}</b> 倍、縦 <b>${state.sy.toFixed(2)}</b> 倍。マス目ごと伸び縮み。`;
  } else if (s === 2) {
    const rad = state.th * Math.PI / 180;
    readout.innerHTML = `θ = <b>${state.th}°</b> → cos θ = <b>${Math.cos(rad).toFixed(2)}</b>, sin θ = <b>${Math.sin(rad).toFixed(2)}</b>。長さも角度も変わらない、純粋な回転。`;
  } else if (s === 3) {
    readout.innerHTML = `赤い矢印 → (<b>${f2(a)}</b>, <b>${f2(c)}</b>) = 1列目、青い矢印 → (<b>${f2(b)}</b>, <b>${f2(d)}</b>) = 2列目。`;
  } else if (s === 4) {
    readout.innerHTML = state.bug
      ? `${m} は対称行列。赤と青の矢印が同じ側に倒れ、F が裏返ってつぶれる。`
      : `いまは正しい回転 ${m}。ボタンで1文字だけ壊すと、何が起きるか。`;
  } else {
    readout.innerHTML = `R × S = ${m}。1つの行列の中に、回転と拡大の両方が入っている。`;
  }
}

/* ---------- ステージ切替 ---------- */
const stepsEl = document.getElementById('steps');
const noteEl = document.getElementById('note');
const scalePanel = document.getElementById('scale-panel');
const rotPanel = document.getElementById('rot-panel');
const bugPanel = document.getElementById('bug-panel');

STAGES.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'step-btn';
  b.textContent = s.label;
  b.addEventListener('click', () => setStage(i + 1));
  stepsEl.appendChild(b);
});

function setStage(n) {
  state.stage = Math.max(1, Math.min(5, n));
  [...stepsEl.children].forEach((b, i) => b.classList.toggle('active', i + 1 === state.stage));
  noteEl.textContent = STAGES[state.stage - 1].note;
  scalePanel.classList.toggle('hidden', state.stage !== 1 && state.stage !== 5);
  rotPanel.classList.toggle('hidden', state.stage < 2);
  bugPanel.classList.toggle('hidden', state.stage !== 4);
  buildCode();
  updateReadout();
  requestRender();
}

/* ---------- 再描画(フレーム間引き) ---------- */
let pending = false;
function requestRender() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => { pending = false; render(); });
}

/* ---------- スライダー・ボタン ---------- */
const ssx = document.getElementById('ssx'), osx = document.getElementById('osx');
const ssy = document.getElementById('ssy'), osy = document.getElementById('osy');
const sth = document.getElementById('sth'), oth = document.getElementById('oth');

function onSlider() {
  state.sx = parseFloat(ssx.value);
  state.sy = parseFloat(ssy.value);
  state.th = parseInt(sth.value, 10);
  osx.value = state.sx.toFixed(2);
  osy.value = state.sy.toFixed(2);
  oth.value = state.th + '°';
  updateDynLines();
  updateReadout();
  requestRender();
}
ssx.addEventListener('input', onSlider);
ssy.addEventListener('input', onSlider);
sth.addEventListener('input', onSlider);
document.getElementById('scale-reset').addEventListener('click', () => {
  ssx.value = 1; ssy.value = 1; onSlider();
});
document.getElementById('rot-reset').addEventListener('click', () => {
  sth.value = 0; onSlider();
});

const bugBtn = document.getElementById('bug-btn');
const bugHint = document.getElementById('bug-hint');
function setBug(on) {
  state.bug = on;
  bugBtn.setAttribute('aria-pressed', String(on));
  bugBtn.textContent = on ? '元の正しい符号に直す(B)' : 'sin の符号を1か所間違える(B)';
  bugHint.textContent = on ? '壊れた行列 [[c, s], [s, c]] を実行中' : 'いまは正しい回転の行列';
  buildCode();          // 行の内容が変わる操作なので再構築でよい
  updateReadout();
  requestRender();
}
bugBtn.addEventListener('click', () => setBug(!state.bug));

/* ---------- コード文字サイズ ---------- */
function setFont(i) {
  state.fontIdx = Math.max(0, Math.min(FONT_SIZES.length - 1, i));
  document.documentElement.style.setProperty('--code-size', FONT_SIZES[state.fontIdx] + 'px');
}
document.getElementById('font-plus').addEventListener('click', () => setFont(state.fontIdx + 1));
document.getElementById('font-minus').addEventListener('click', () => setFont(state.fontIdx - 1));

/* ---------- キーボード ---------- */
window.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT') return;
  if (ev.key >= '1' && ev.key <= '5') setStage(+ev.key);
  else if (ev.key === 'ArrowRight') setStage(state.stage + 1);
  else if (ev.key === 'ArrowLeft') setStage(state.stage - 1);
  else if ((ev.key === 'b' || ev.key === 'B') && state.stage === 4) setBug(!state.bug);
});

/* ---------- 起動 ---------- */
setStage(1);
</script>
